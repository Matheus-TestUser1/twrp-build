name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'URL do manifest'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'Branch do manifest'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'URL do device tree'
        required: true
        default: 'https://github.com/Matheus-TestUser1/twrpdt-manaus-U1TM34.107_34_3'
      DEVICE_TREE_BRANCH:
        description: 'Branch do device tree'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Caminho do device tree'
        required: true
        default: 'device/motorola/manaus'
      COMMON_TREE_URL:
        description: 'URL do common tree (se não houver, deixe em branco)'
        required: false
      COMMON_PATH:
        description: 'Caminho do common tree (se não houver, deixe em branco)'
        required: false
      DEVICE_NAME:
        description: 'Nome do dispositivo'
        required: true
        default: 'manaus'
      MAKEFILE_NAME:
        description: 'Nome do makefile'
        required: true
        default: 'twrp_manaus'
      BUILD_TARGET:
        description: 'Target de build'
        required: true
        default: 'vendorbootimage'
        type: choice
        options:
          - 'vendorbootimage'
          - 'recoveryimage'
          - 'bootimage'
          - 'vendorimage'
      USE_CCACHE:
        description: 'Usar ccache para acelerar builds subsequentes'
        required: false
        default: 'true'
        type: boolean
      CLEAN_BUILD:
        description: 'Forçar clean build (ignorar cache)'
        required: false
        default: 'false'
        type: boolean

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 5G

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "Use CCACHE: ${{ github.event.inputs.USE_CCACHE }}"
        echo "::endgroup::"

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup ccache
      if: ${{ github.event.inputs.USE_CCACHE == 'true' }}
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}
        max-size: 5G
        restore-keys: |
          ${{ github.event.inputs.DEVICE_NAME }}-
          recovery-build-

    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install \
          gperf \
          gcc-multilib \
          gcc-10-multilib \
          g++-multilib \
          build-essential \
          clang \
          g++-10-multilib \
          libc6-dev \
          lib32ncurses6 \
          libncurses-dev \
          libncurses6 \
          xorg-dev \
          libx11-dev \
          tree \
          lib32z-dev \
          libgl1-mesa-dev \
          libxml2-utils \
          xsltproc \
          bc \
          ccache \
          liblz4-tool \
          libsdl2-dev \
          libwxgtk3.2-dev \
          libxml2 \
          lzop \
          pngcrush \
          schedtool \
          squashfs-tools \
          imagemagick \
          libbz2-dev \
          xz-utils \
          ncftp \
          qemu-user-static \
          libstdc++-10-dev \
          e2fsprogs \
          python3 \
          android-sdk-platform-tools \
          android-sdk-build-tools

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') || 
          startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Clone and setup OrangeFox scripts
      run: |
        cd ~
        sudo apt install git aria2 -y
        git clone https://gitlab.com/Matheus-TestUser1/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        cd ~

    - name: Initialize repo
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Create local_manifests directory
      run: mkdir -p .repo/local_manifests
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Add device tree to local_manifests
      run: |
        DEVICE_URL="${{ github.event.inputs.DEVICE_TREE_URL }}"
        DEVICE_BRANCH="${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        DEVICE_PATH="${{ github.event.inputs.DEVICE_PATH }}"

        if [[ "$DEVICE_URL" == *"github.com"* ]]; then
          REMOTE="github"
          REPO_NAME=$(echo "$DEVICE_URL" | sed 's|https://github.com/||' | sed 's|.git$||')
        elif [[ "$DEVICE_URL" == *"gitlab.com"* ]]; then
          REMOTE="gitlab"
          REPO_NAME=$(echo "$DEVICE_URL" | sed 's|https://gitlab.com/||' | sed 's|.git$||')
        else
          REMOTE="origin"
          REPO_NAME=$(basename -s .git "$DEVICE_URL")
        fi

        cat > .repo/local_manifests/device.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="${REPO_NAME}" path="${DEVICE_PATH}" remote="${REMOTE}" revision="${DEVICE_BRANCH}"/>
        </manifest>
        EOF

        echo "Generated device.xml:"
        cat .repo/local_manifests/device.xml
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Add common tree to local_manifests
      if: ${{ github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != '' }}
      run: |
        COMMON_URL="${{ github.event.inputs.COMMON_TREE_URL }}"
        COMMON_BRANCH="${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        COMMON_PATH="${{ github.event.inputs.COMMON_PATH }}"

        if [[ "$COMMON_URL" == *"github.com"* ]]; then
          REMOTE="github"
          REPO_NAME=$(echo "$COMMON_URL" | sed 's|https://github.com/||' | sed 's|.git$||')
        elif [[ "$COMMON_URL" == *"gitlab.com"* ]]; then
          REMOTE="gitlab"
          REPO_NAME=$(echo "$COMMON_URL" | sed 's|https://gitlab.com/||' | sed 's|.git$||')
        else
          REMOTE="origin"
          REPO_NAME=$(basename -s .git "$COMMON_URL")
        fi

        cat > .repo/local_manifests/common.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project name="${REPO_NAME}" path="${COMMON_PATH}" remote="${REMOTE}" revision="${COMMON_BRANCH}"/>
        </manifest>
        EOF
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --prune
      working-directory: workspace

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh

        if [ "${{ github.event.inputs.USE_CCACHE }}" == "true" ]; then
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          ccache -z
          echo "::group::CCache Stats (antes)"
          ccache -s
          echo "::endgroup::"
        fi

        export ALLOW_MISSING_DEPENDENCIES=true

        if [ "${{ github.event.inputs.CLEAN_BUILD }}" == "true" ]; then
          echo "Executando clean build..."
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean
        fi

        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && mka -j$(nproc --all) ${{ github.event.inputs.BUILD_TARGET }}

        if [ "${{ github.event.inputs.USE_CCACHE }}" == "true" ]; then
          echo "::group::CCache Stats (depois)"
          ccache -s
          echo "::endgroup::"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    # ✅ NOVO: step que verifica quais arquivos existem e seta output
    - name: Find output files
      id: find-outputs
      run: |
        OUT_DIR="${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        echo "Listando arquivos em $OUT_DIR:"
        ls -lh "$OUT_DIR"/*.img 2>/dev/null || echo "Nenhum .img encontrado"

        if ls "$OUT_DIR"/*.img 1>/dev/null 2>&1; then
          echo "main_file_exists=true" >> $GITHUB_OUTPUT
        else
          echo "main_file_exists=false" >> $GITHUB_OUTPUT
          echo "::error::Nenhum arquivo .img encontrado! O build pode ter falhado silenciosamente."
          exit 1
        fi

    - name: Generate Checksums
      if: ${{ steps.find-outputs.outputs.main_file_exists == 'true' }}
      run: |
        OUT_DIR="${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        cd "$OUT_DIR"
        for file in *.img; do
          if [ -f "$file" ]; then
            md5sum "$file" > "$file.md5"
            sha256sum "$file" > "$file.sha256"
            echo "Checksum gerado para: $file"
          fi
        done

    # ✅ CORRIGIDO: um único step de upload com body correto e paths dinâmicos
    - name: Upload to Release
      if: ${{ steps.find-outputs.outputs.main_file_exists == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.md5
          ${{ steps.pwd.outputs.workspace-folder }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.sha256
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_TARGET }}-${{ github.run_id }}
        tag_name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        body: |
          **Manifest:** ${{ github.event.inputs.MANIFEST_BRANCH }}
          **Device:** ${{ github.event.inputs.DEVICE_NAME }}
          **Target:** ${{ github.event.inputs.BUILD_TARGET }}.img
          **Build ID:** ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify on Failure
      if: ${{ failure() }}
      run: |
        echo "::error::Build falhou! Verifique os logs acima."
        echo "Possíveis causas:"
        echo "- Device tree incompatível com o manifest"
        echo "- Dependências faltantes"
        echo "- Erros de compilação no código fonte"
